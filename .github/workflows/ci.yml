name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Node.js ${{ matrix.node }} checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check TypeScript
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Test with full production coverage
        run: npm run test:coverage
      - name: Measure code and dependencies
        run: npm run audit:code
      - name: Audit locked dependencies
        run: npm audit --audit-level=high
      - name: Verify installed npm package
        run: npm run check:package
      - name: Check watcher shell syntax
        run: bash -n scripts/watch-codex-config.sh
